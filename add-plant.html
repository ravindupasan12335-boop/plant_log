<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Plant - PlantLog</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom theme consistent with your other pages */
        body { background-color: #f4f7f6; } 
        .bg-forest { background-color: #2e7d32 !important; }
        .text-forest { color: #2e7d32 !important; }
        
        /* Hover effect for the submit button */
        .hover-effect {
            transition: all 0.3s ease; 
        }
        .hover-effect:hover {
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.3) !important; 
            filter: brightness(1.1); 
        }
    </style>
</head>

<body>
    <div class="container py-5">

        <!-- Header & Navigation (Standardized across all pages) -->
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-forest">🌱 PlantLog</h1>
            <p class="lead text-muted">Your simple plant organizer</p>

            <!-- Navigation styled as pill buttons -->
            <nav class="d-flex justify-content-center flex-wrap gap-2 gap-md-3 mt-4">
                <a href="index.html" class="btn btn-outline-success rounded-pill px-4">Home</a>
                <a href="plants.html" class="btn btn-outline-success rounded-pill px-4">Plants</a>
                <!-- The 'Add Plant' button is filled in to show the active page -->
                <a href="add-plant.html" class="btn bg-forest text-white rounded-pill px-4 shadow-sm">Add Plant</a>
                <a href="inventory.html" class="btn btn-outline-success rounded-pill px-4">Inventory</a>
            </nav>
        </header>

        <main class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Section Title -->
                <div class="border-bottom pb-2 mb-4 text-center">
                    <h2 class="text-forest fw-bold m-0">Add a New Plant</h2>
                </div>

                <!-- The Form Card -->
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <form id="addPlantForm" class="needs-validation" novalidate>
                            <!-- Text Input -->
                            <div class="mb-3">
                                <label for="name" class="form-label text-forest fw-bold">Plant Name</label>
                                <input type="text" id="name" name="name" class="form-control" placeholder="e.g., Monstera Deliciosa" required>
                                <div class="invalid-feedback">
                                    Please enter a plant name.
                                </div>
                            </div>

                            <!-- Grouping Type and Quantity side-by-side on desktop -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="type" class="form-label text-forest fw-bold">Plant Type</label>
                                    <select id="type" name="type" class="form-select">
                                        <option>Indoor</option>
                                        <option>Outdoor</option>
                                        <option>Tropical</option>
                                        <option>Succulent</option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="quantity" class="form-label text-forest fw-bold">Quantity</label>
                                    <input type="number" id="quantity" name="quantity" class="form-control" placeholder="0">
                                </div>
                            </div>

                            <!-- Select Inputs -->
                            <div class="mb-3">
                                <label for="watering" class="form-label text-forest fw-bold">Watering Schedule</label>
                                <select id="watering" name="watering" class="form-select">
                                    <option>Every day</option>
                                    <option>Every 3 days</option>
                                    <option>Every 7 days</option>
                                    <option>Every 14 days</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="sunlight" class="form-label text-forest fw-bold">Sunlight Requirements</label>
                                <select id="sunlight" name="sunlight" class="form-select">
                                    <option>Low</option>
                                    <option>Medium</option>
                                    <option>Bright indirect</option>
                                    <option>Direct sunlight</option>
                                </select>
                            </div>

                            <!-- Text Area -->
                            <div class="mb-4">
                                <label for="description" class="form-label text-forest fw-bold">Description</label>
                                <textarea id="description" name="description" rows="4" class="form-control" placeholder="Add some notes about this plant..."></textarea>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn bg-forest text-white w-100 rounded-pill py-2 fw-bold fs-5 shadow-sm hover-effect">Save Plant</button>
                            <p id="formMessage" class="text-success fw-bold text-center p-3 mb-0"></p>

                        </form>

                    </div>
                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center mt-5 py-4 text-muted border-top">
            <p class="mb-0">PlantLog © 2026</p>
        </footer>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
