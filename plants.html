<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Plants - PlantLog</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS (Fixed version to stable 5.3.3) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom theme consistent with your Add Plant page */
        body { background-color: #f4f7f6; } 
        .bg-forest { background-color: #2e7d32 !important; }
        .text-forest { color: #2e7d32 !important; }
        
        /* Hover effect for the plant cards */
        .hover-effect {
            transition: all 0.3s ease;
        }
        .hover-effect:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.15) !important;
        }
    </style>
</head>

<body>
    <div class="container py-5">

        <!-- Header & Navigation -->
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-forest">🌱 PlantLog</h1>
            <p class="lead text-muted">Your simple plant organizer</p>

            <!-- Navigation styled as pill buttons -->
            <nav class="d-flex justify-content-center flex-wrap gap-2 gap-md-3 mt-4">
                <a href="index.html" class="btn btn-outline-success rounded-pill px-4">Home</a>
                <!-- The 'Plants' button is filled in to show the user they are currently on this page -->
                <a href="plants.html" class="btn bg-forest text-white rounded-pill px-4 shadow-sm">Plants</a>
                <a href="add-plant.html" class="btn btn-outline-success rounded-pill px-4">Add Plant</a>
                <a href="inventory.html" class="btn btn-outline-success rounded-pill px-4">Inventory</a>
            </nav>
        </header>

        <main>
            <!-- Section Title -->
            <div class="d-flex justify-content-between align-items-end border-bottom pb-2 mb-4" >
                <h2 class="text-forest fw-bold m-0">My Plants</h2>
            </div>

            <!-- Plant Cards Grid -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="plantsGrid">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Loading plants...</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center mt-5 py-4 border-top text-muted">
            <p class="mb-0">PlantLog © 2026</p>
        </footer>

    </div>
    <script src="app.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
