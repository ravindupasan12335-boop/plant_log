<!DOCTYPE html>
<html lang="en">
<head>
    <title>Plant Details - PlantLog</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom theme consistent with your other pages */
        body { background-color: #f4f7f6; } 
        .bg-forest { background-color: #2e7d32 !important; }
        .text-forest { color: #2e7d32 !important; }
        
        /* Hover effect for action buttons */
        .hover-effect {
            transition: all 0.3s ease; 
        }
        .hover-effect:hover {
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.3) !important; 
            filter: brightness(1.1); 
        }

        /* Placeholder image background */
        .image-placeholder {
            background-color: #e8f5e9;
            min-height: 250px;
        }
    </style>
</head>

<body>
    <div class="container py-5">

        <!-- Header & Navigation -->
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-forest">🌱 PlantLog</h1>
            
            <!-- Navigation styled as pill buttons -->
            <nav class="d-flex justify-content-center flex-wrap gap-2 gap-md-3 mt-4">
                <a href="index.html" class="btn btn-outline-success rounded-pill px-4">Home</a>
                <a href="plants.html" class="btn btn-outline-success rounded-pill px-4">Plants</a>
                <a href="add-plant.html" class="btn btn-outline-success rounded-pill px-4">Add Plant</a>
                <a href="inventory.html" class="btn btn-outline-success rounded-pill px-4">Inventory</a>
            </nav>
        </header>

        <main class="row justify-content-center">
            <div class="col-lg-9">

                <!-- Back Navigation -->
                <div class="mb-4">
                    <a href="plants.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-bold">
                        &larr; Back to My Plants
                    </a>
                </div>

                <!-- Plant Details Card -->
                <div class="card shadow border-0 rounded-4 overflow-hidden">
                    <div class="row g-0">
                        
                        <!-- Left Side: Image / Visual Area -->
                        <!-- On mobile, this sits on top. On desktop, it takes up 4 columns on the left. -->
                        <div class="col-md-4 image-placeholder d-flex align-items-center justify-content-center">
                            <span class="display-1">🪴</span>
                        </div>
                        
                        <!-- Right Side: Data -->
                        <div class="col-md-8">
                            <div class="card-body p-4 p-md-5">
                                
                                <!-- Title and Status (IDs added for JS) -->
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h2 id="detailName" class="fw-bold text-dark m-0">Loading...</h2>
                                    <span id="detailStatus" class="badge bg-secondary rounded-pill px-3 py-2 shadow-sm">...</span>
                                </div>
                                
                                <!-- Category Badge (ID added for JS) -->
                                <span id="detailCategory" class="badge bg-success bg-opacity-25 text-forest mb-4 fs-6 px-3 py-2 rounded-pill">...</span>
                                
                                <!-- Quick Stats Grid (IDs added for JS) -->
                                <div class="row mb-4 g-3 bg-light p-3 rounded-4">
                                    <div class="col-6">
                                        <p class="text-muted small mb-1 fw-bold text-uppercase tracking-wide">💧 Watering</p>
                                        <p id="detailWatering" class="fw-bold m-0 fs-5 text-dark">...</p>
                                    </div>
                                    <div class="col-6">
                                        <p class="text-muted small mb-1 fw-bold text-uppercase tracking-wide">☀️ Sunlight</p>
                                        <p id="detailSunlight" class="fw-bold m-0 fs-5 text-dark">...</p>
                                    </div>
                                    <div class="col-6">
                                        <p class="text-muted small mb-1 fw-bold text-uppercase tracking-wide">📦 Quantity</p>
                                        <p id="detailQuantity" class="fw-bold m-0 fs-5 text-dark">...</p>
                                    </div>
                                </div>

                                <!-- Description (ID added for JS) -->
                                <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">Description</h5>
                                <p id="detailDescription" class="text-muted mb-5">
                                    Loading details...
                                </p>
                                
                                <!-- Action Buttons -->
                                <div class="d-flex flex-wrap gap-2 mt-auto">
                                    <button id="detailWaterBtn" class="btn btn-success rounded-pill px-4 py-2 fw-bold hover-effect">
                                        💧 Water Plant
                                    </button>
                                    <button id="detailDeleteBtn" class="btn btn-outline-danger rounded-pill px-4 py-2 fw-bold hover-effect">
                                        🗑️ Delete
                                    </button>
                                </div>
                                <div id="detailMessage" class="mt-3"></div>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center mt-5 py-4 text-muted border-top">
            <p class="mb-0">PlantLog © 2026</p>
        </footer>

    </div>
    
    <!-- Link to your JavaScript logic -->
    <script src="app.js"></script>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
