<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inventory - PlantLog</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS (Fixed version to stable 5.3.3) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom theme consistent with your other pages */
        body { background-color: #f4f7f6; } 
        .bg-forest { background-color: #2e7d32 !important; }
        .text-forest { color: #2e7d32 !important; }
    </style>
</head>

<body>
    <div class="container py-5">

        <!-- Header & Navigation -->
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-forest">🌱 PlantLog</h1>
            <p class="lead text-muted">Your simple plant organizer</p>
            
            <!-- Navigation styled as pill buttons -->
            <nav class="d-flex justify-content-center flex-wrap gap-2 gap-md-3 mt-4">
                <a href="index.html" class="btn btn-outline-success rounded-pill px-4">Home</a>
                <a href="plants.html" class="btn btn-outline-success rounded-pill px-4">Plants</a>
                <a href="add-plant.html" class="btn btn-outline-success rounded-pill px-4">Add Plant</a>
                <!-- The 'Inventory' button is filled in to show the active page -->
                <a href="inventory.html" class="btn bg-forest text-white rounded-pill px-4 shadow-sm">Inventory</a>
            </nav>
        </header>

        <main>
            <!-- Table wrapped in a Card for a clean look -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-body p-0">
                    
                    <!-- table-responsive ensures the table scrolls horizontally on small phones instead of breaking the layout -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            
                            <!-- Table Header -->
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="py-3 px-4 text-muted">Plant Name</th>
                                    <th scope="col" class="py-3 px-4 text-muted text-center">Quantity</th>
                                    <th scope="col" class="py-3 px-4 text-muted">Status</th>
                                    <th scope="col" class="py-3 px-4 text-muted">Add/Remove</th>
                                    <th scope="col" class="py-3 px-4 text-end">Actions</th>
                                </tr>
                            </thead>
                            
                            <!-- Table Body -->
                            <tbody id="inventoryBody">
                            </tbody>

                        </table>
                    </div>

                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center mt-5 py-4 text-muted border-top">
            <p class="mb-0">PlantLog © 2026</p>
        </footer>

    </div>
    <script src="app.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
